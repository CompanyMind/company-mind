# Server-only: keep internal ports off the public interface. TLS is terminated
# by host nginx (/etc/nginx/sites-available/companymind) with certbot certs.
services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
  engine:
    restart: unless-stopped
  bot:
    restart: unless-stopped
  web:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  marketing:
    ports: !override
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
