# CompanyMind — product app (web, :3000) and public marketing site (:3001).
# TLS is added by certbot (--nginx) into these blocks. Containers listen on
# 127.0.0.1 only (see deploy/docker-compose.override.yml).
#
# Mirrors the live /etc/nginx/sites-available/companymind on the droplet,
# including the blocks certbot wrote. See deploy/README.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    server_name app.companymind.uz app.165-22-176-157.sslip.io;

    client_max_body_size 100m;

    location = / { return 302 /dashboard; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Answers can take a while on self-hosted models.
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.companymind.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.companymind.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name companymind.uz www.companymind.uz 165-22-176-157.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.companymind.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.companymind.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.165-22-176-157.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = app.companymind.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name app.companymind.uz app.165-22-176-157.sslip.io;
    return 404; # managed by Certbot
}

server {
    if ($host = www.companymind.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = companymind.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = 165-22-176-157.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name companymind.uz www.companymind.uz 165-22-176-157.sslip.io;
    return 404; # managed by Certbot
}
