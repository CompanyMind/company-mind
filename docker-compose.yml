services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Exposed on localhost so host-run tooling (drizzle-kit migrate, seed) can reach it.
      # The engine and web reach it over the compose network as db:5432 regardless.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: ./engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      MODELS_BASE_URL: ${MODELS_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBED_MODEL: ${EMBED_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      EMBED_DIM: ${EMBED_DIM}
      TELEGRAM_ENC_KEY: ${TELEGRAM_ENC_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      db:
        condition: service_healthy
    # No ports: engine is never internet-exposed.

  bot:
    build: ./engine
    command: ["uv", "run", "python", "-m", "app.bot.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODELS_BASE_URL: ${MODELS_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBED_MODEL: ${EMBED_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      EMBED_DIM: ${EMBED_DIM}
      TELEGRAM_ENC_KEY: ${TELEGRAM_ENC_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      db:
        condition: service_healthy
    # Long-polls Telegram (outbound only); never internet-exposed.

  web:
    build: ./web
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      ENGINE_BASE_URL: ${ENGINE_BASE_URL}
      STORAGE_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Public marketing site. A SEPARATE deployable on purpose: it is public,
  # stateless, needs no DB/engine/secrets, and NEVER ships to a customer
  # datacenter. In production it belongs on a CDN/edge host, not on-prem.
  marketing:
    build: ./marketing
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"

volumes:
  dbdata:
  uploads:
