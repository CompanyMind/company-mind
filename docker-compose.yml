services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # Exposed on localhost so host-run tooling (drizzle-kit migrate, seed) can reach it.
      # The engine and web reach it over the compose network as db:5432 regardless.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build: ./engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      MODELS_BASE_URL: ${MODELS_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      EMBED_DIM: ${EMBED_DIM}
    depends_on:
      db:
        condition: service_healthy
    # No ports: engine is never internet-exposed.

  web:
    build: ./web
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      ENGINE_BASE_URL: ${ENGINE_BASE_URL}
      STORAGE_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  dbdata:
  uploads:
