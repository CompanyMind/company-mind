[project]
name = "compbrain-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pypdf>=6.14.2",
  "python-docx>=1.2.0",
  "pgvector>=0.5.0",
  "python-multipart>=0.0.32",
  "cryptography>=49.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
